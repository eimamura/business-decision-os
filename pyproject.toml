[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "business-decision-os"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "celery[redis]>=5.3.0",
  "fastapi>=0.136.1",
  "python-dotenv>=1.0.0",
  "pulp>=2.7.0",
  "pydantic>=2.7.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "redis>=5.0.0",
  "uvicorn>=0.47.0",
]

[tool.uv]
dev-dependencies = [
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pyyaml>=6.0",
  "vcrpy>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages", "apps"]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/simulation-worker",
  "apps/optimization-worker",
  "packages/agent",
  "packages/tools",
  "packages/domain",
  "packages/simulation",
  "packages/optimization",
  "packages/prediction",
  "packages/memory",
  "packages/state",
  "packages/schemas",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: end-to-end tests requiring a running API server on localhost:8000",
]
