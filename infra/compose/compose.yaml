services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: bdos
      POSTGRES_USER: bdos
      POSTGRES_PASSWORD: bdos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bdos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://bdos:bdos_dev@db:5432/bdos
      APP_ENV: dev
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../data:/app/data
    command: ["/bin/sh", "-c", "cd /app/apps/api && /app/.venv/bin/alembic upgrade head"]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5-coder:7b}"]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://bdos:bdos_dev@db:5432/bdos
      APP_ENV: dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3002}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JOB_RUNNER_BACKEND: celery
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - ../../config:/app/config
      - ../../data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  celery-worker:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      ollama-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://bdos:bdos_dev@db:5432/bdos
      APP_ENV: dev
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - ../../config:/app/config
    command: ["/app/.venv/bin/celery", "-A", "packages.agent.runner.celery_app",
              "worker", "--loglevel=info", "--concurrency=2", "--queues=celery"]
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A packages.agent.runner.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-worker-training:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://bdos:bdos_dev@db:5432/bdos
      APP_ENV: dev
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - ../../config:/app/config
    command: ["/app/.venv/bin/celery", "-A", "packages.agent.runner.celery_app",
              "worker", "--loglevel=info", "--concurrency=1", "--queues=training"]
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A packages.agent.runner.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.dev
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  ollama_data:
