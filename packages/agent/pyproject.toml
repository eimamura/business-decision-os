[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.30.0",
  "langchain-core>=0.3.0",
  "langchain-anthropic>=0.3",
  "langchain-ollama>=0.3",
  "langgraph>=1.2.4",
  "langgraph-checkpoint>=2.0.0",
  "pydantic>=2.7.0",
  "structlog>=24.1.0",
  "typing_extensions>=4.0.0",
]
