name: Lint and Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - run: uv run ruff check packages/ apps/api/ scripts/
      - run: uv run mypy packages/ apps/api/
      - run: uv run pytest tests/unit/ -x -q

  python-integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdos_test
          POSTGRES_USER: bdos
          POSTGRES_PASSWORD: bdos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://bdos:bdos@localhost:5432/bdos_test
      - name: Run integration tests
        run: uv run pytest tests/integration/ -x -q
        env:
          DATABASE_URL: postgresql://bdos:bdos@localhost:5432/bdos_test

  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd apps/web && npm ci
      - run: cd apps/web && npx tsc --noEmit
      - run: cd apps/web && npm run build
