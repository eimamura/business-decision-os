name: Lint and Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test-unit

  python-integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bdos_test
          POSTGRES_USER: bdos
          POSTGRES_PASSWORD: bdos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync
      - name: Run Alembic migrations
        run: make migrate
        env:
          DATABASE_URL: postgresql://bdos:bdos@localhost:5432/bdos_test
      - name: Run integration tests
        run: make test-integration
        env:
          DATABASE_URL: postgresql://bdos:bdos@localhost:5432/bdos_test

  node-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Web production build (reproducible pnpm install --frozen-lockfile + next build)
        run: make build
      - name: Python + TypeScript typecheck
        run: make typecheck
      - name: Frontend Vitest suite
        run: make test-web
