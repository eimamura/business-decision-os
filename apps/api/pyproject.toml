[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "sqlalchemy>=2.0.0",
  "structlog>=24.1.0",
  "opentelemetry-sdk>=1.24.0",
  "opentelemetry-exporter-otlp>=1.24.0",
  "langfuse>=2.0.0",
]
